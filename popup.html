<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 280px;
      min-height: 240px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      padding: 24px 20px 20px 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: #1a1a1a;
    }

    .subtitle {
      font-size: 12px;
      color: #999;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      background: #7bc96a;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .action-btn:hover {
      background: #6ab859;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .action-btn svg {
      width: 18px;
      height: 18px;
      stroke: #ffffff;
    }

    .action-btn:disabled {
      background: #d0d0d0;
      cursor: not-allowed;
    }

    .status {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #1a1a1a;
      background: #f5f5f5;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      flex-shrink: 0;
    }

    .status.success {
      background: #f0f9ed;
      color: #4a9e3a;
    }

    .status.error {
      background: #fef2f2;
      color: #dc2626;
    }

    .status.info {
      background: #eff6ff;
      color: #2563eb;
    }

    .footer {
      border-top: 1px solid #f0f0f0;
      padding-top: 16px;
      margin-top: 16px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .github-link {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #666;
      font-size: 12px;
      transition: color 0.2s;
    }

    .github-link:hover {
      color: #1a1a1a;
    }

    .github-link svg {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
